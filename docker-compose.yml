services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./Frontend

    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
